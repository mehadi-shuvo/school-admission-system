services:
  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
      POSTGRES_USER: ${POSTGRES_USER:-school_admission}
      # This public, local-only fallback is deliberately unsuitable for any shared environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - internal
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/SchoolAdmission.Api/Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      ConnectionStrings__AdmissionDb: Host=db;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-school_admission};Password=${POSTGRES_PASSWORD:-local-development-only-password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/SchoolAdmission.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      ConnectionStrings__AdmissionDb: Host=db;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-school_admission};Password=${POSTGRES_PASSWORD:-local-development-only-password}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    networks:
      - application
      - internal
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      FRONTEND_API_UPSTREAM: ${FRONTEND_API_UPSTREAM:-backend:8080}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - application
    restart: unless-stopped
    init: true

volumes:
  postgres-data:

networks:
  application:
  internal:
    internal: true
